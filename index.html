<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liga do Brasil — Futebol</title>
<style>
:root{--bg:#08130f;--panel:#102019;--panel2:#173025;--lime:#b9ff38;--white:#f5f7f3;--muted:#9caf9f;--gold:#ffc84a;--line:#294136}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#1c3b2d 0,transparent 35%),var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}.app{max-width:1500px;margin:auto;display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--lime)}.season{margin:18px 0 28px;color:var(--muted);font-size:12px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:8px;color:var(--muted);font-weight:700}.nav button.active{background:var(--lime);color:#102018}.club-mini{margin-top:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.club-mini strong{display:block;font-size:14px}.club-mini small{color:var(--muted)}main{padding:24px 28px 40px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.topbar h1{font-size:26px;margin:0}.week{color:var(--muted);font-size:13px}.screen{display:none}.screen.active{display:block}.dashboard{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.75fr);gap:18px}.card{background:rgba(16,32,25,.92);border:1px solid var(--line);border-radius:14px;padding:18px}.match-hero{min-height:330px;position:relative;overflow:hidden;background:linear-gradient(135deg,#17392b,#0d1c16)}.match-hero:after{content:"";position:absolute;width:330px;height:330px;border:1px solid rgba(185,255,56,.12);border-radius:50%;right:-100px;top:-120px}.match-header{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.teams{display:flex;align-items:center;justify-content:center;gap:38px;height:210px}.team{text-align:center;width:130px}.crest{width:82px;height:82px;margin:0 auto 12px;border-radius:50% 50% 43% 43%;display:grid;place-items:center;font-weight:950;font-size:27px;border:5px solid rgba(255,255,255,.12);box-shadow:0 12px 30px #0006}.crest.home{background:#e9f0e8;color:#0a2417}.crest.away{background:#c83a32;color:white}.team b{display:block}.team small{color:var(--muted)}.versus{font-size:18px;font-weight:900;color:var(--lime)}.primary{width:100%;border:0;border-radius:8px;background:var(--lime);color:#102018;padding:13px;font-weight:900}.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{background:#0d1813;border:1px solid var(--line);border-radius:10px;padding:12px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{font-size:20px}.right-stack{display:grid;gap:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;padding:8px}.table td{padding:9px 8px;border-top:1px solid var(--line)}.table tr.selected td{background:rgba(185,255,56,.08)}.form{display:flex;gap:3px}.dot{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:bold}.w{background:#4ba65a}.d{background:#7b8359}.l{background:#a64b46}.fixtures{display:grid;gap:8px}.fixture{display:grid;grid-template-columns:1fr 45px 1fr;align-items:center;text-align:center;padding:10px;border-bottom:1px solid var(--line);font-size:13px}.fixture span:first-child{text-align:left}.fixture span:last-child{text-align:right}.fixture b{color:var(--lime)}.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.player{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.player-head{display:flex;justify-content:space-between}.rating{color:var(--lime);font-weight:900}.player h3{margin:12px 0 3px;font-size:15px}.player p{margin:0;color:var(--muted);font-size:12px}.player-line{height:5px;background:#26382f;border-radius:5px;margin-top:14px;overflow:hidden}.player-line i{display:block;height:100%;background:var(--lime)}.game-layout{display:grid;grid-template-columns:1fr 280px;gap:18px}.pitch{height:520px;border-radius:14px;border:1px solid #79a66b;background:linear-gradient(90deg,#2d6b3b 50%,#347745 50%) 0 0/180px 100%;position:relative;overflow:hidden}.pitch:before{content:"";position:absolute;left:50%;top:0;height:100%;width:2px;background:rgba(255,255,255,.6)}.pitch:after{content:"";position:absolute;width:140px;height:140px;border:2px solid rgba(255,255,255,.6);border-radius:50%;left:calc(50% - 70px);top:calc(50% - 70px)}.boxl,.boxr{position:absolute;top:32%;width:70px;height:36%;border:2px solid rgba(255,255,255,.6)}.boxl{left:-2px}.boxr{right:-2px}.player-dot{position:absolute;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:bold;z-index:2;transition:.35s linear;border:2px solid white}.player-dot.us{background:#dce9e0;color:#15331f}.player-dot.them{background:#e04b42}.ball{position:absolute;width:10px;height:10px;border-radius:50%;background:white;z-index:3;transition:.35s linear}.game-score{display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:900}.game-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.game-controls button{height:52px;border:1px solid var(--line);background:var(--panel);border-radius:8px}.game-controls button.attack{background:var(--lime);color:#102018;border:0;font-weight:bold}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#eaf5ec;color:#102018;border-radius:8px;padding:12px 18px;font-weight:bold;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:20;bottom:0;left:0;right:0;height:68px;border-right:0;border-top:1px solid var(--line);padding:7px;background:#0b1711}.brand,.season,.club-mini{display:none}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;padding:12px 4px;font-size:11px}main{padding:18px 14px 90px}.dashboard,.game-layout{grid-template-columns:1fr}.right-stack{grid-template-columns:1fr}.roster{grid-template-columns:repeat(2,1fr)}.pitch{height:430px}.teams{gap:10px}.crest{width:68px;height:68px}.topbar h1{font-size:21px}}@media(max-width:480px){.roster{grid-template-columns:1fr 1fr}.player{padding:10px}.match-hero{min-height:300px}.teams{height:190px}.team{width:110px}.dashboard{gap:12px}.stats-row{grid-template-columns:repeat(3,1fr)}.stat b{font-size:16px}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand">LIGA <span>BRASIL</span></div><div class="season">TEMPORADA 2026 · RODADA <b id="navRound">1</b></div><nav class="nav"><button class="active" data-screen="home">⬢ Central</button><button data-screen="league">▦ Classificação</button><button data-screen="squad">♟ Elenco</button><button data-screen="game">◉ Jogar</button></nav><div class="club-mini"><strong>Verde FC</strong><small>Orçamento: R$ 42 mi</small></div></aside>
<main><div class="topbar"><h1 id="title">Central</h1><div class="week" id="week">10 MAI · 18:30</div></div>
<section id="home" class="screen active"><div class="dashboard"><div class="match-hero card"><div class="match-header"><span>PRÓXIMO JOGO · RODADA <b class="roundNum">1</b></span><span>🏟 Arena Verde</span></div><div class="teams"><div class="team"><div class="crest home">VFC</div><b>Verde FC</b><small>FOR 78</small></div><div class="versus">VS</div><div class="team"><div class="crest away">UCR</div><b id="opponentName">União</b><small id="opponentFor">FOR 74</small></div></div><button class="primary" onclick="openMatch()">IR PARA A PARTIDA</button></div><div class="right-stack"><div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>Classificação</b><button style="border:0;background:transparent;color:var(--lime);font-size:12px" onclick="show('league')">Ver tudo</button></div><div id="miniTable"></div></div><div class="card"><b>Calendário</b><div class="fixtures" id="fixtures" style="margin-top:10px"></div></div></div></div><div class="stats-row"><div class="stat"><span>Posição</span><b id="positionStat">—</b></div><div class="stat"><span>Pontos</span><b id="pointsStat">0</b></div><div class="stat"><span>Saldo</span><b id="gdStat">0</b></div></div></section>
<section id="league" class="screen"><div class="card table-wrap"><table class="table"><thead><tr><th>#</th><th>Clube</th><th>PTS</th><th>PJ</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Últimos</th></tr></thead><tbody id="leagueTable"></tbody></table></div></section>
<section id="squad" class="screen"><div class="roster" id="roster"></div></section>
<section id="game" class="screen"><div class="game-layout"><div><div class="game-score card"><span>VERDE FC</span><span id="score">0 — 0</span><span id="gameOpponent">UNIÃO</span></div><div class="pitch" id="pitch"><div class="boxl"></div><div class="boxr"></div><div id="actors"></div><div class="ball" id="ball"></div></div></div><div class="card"><b>Partida ao vivo</b><p id="minute" style="font-size:38px;margin:12px 0;color:var(--lime)">00'</p><p id="commentary" style="color:var(--muted);min-height:55px">A bola vai rolar.</p><div class="game-controls"><button onclick="tactic('esquerda')">←</button><button class="attack" onclick="attack()">ATACAR</button><button onclick="tactic('direita')">→</button></div><button class="primary" style="margin-top:10px" id="playButton" onclick="advanceMatch()">JOGAR 15 MIN</button></div></div></section>
</div><div class="toast" id="toast"></div>
<script>
const teams=[
{name:'Verde FC',short:'VFC',for:78,us:true},{name:'União Clube',short:'UCR',for:74},{name:'Rubro Norte',short:'RNO',for:76},{name:'Aurora SC',short:'ASC',for:72},{name:'Atlético Sul',short:'ASU',for:75},{name:'Praia FC',short:'PFC',for:71},{name:'Capital',short:'CAP',for:73},{name:'Imperial',short:'IMP',for:77}
];
let round=1,matchRunning=false,minute=0,score=[0,0],matchActive=false,ballPos=[50,50];
let table=teams.map((t,i)=>({t,p:0,j:0,v:0,e:0,d:0,gd:0,form:i?'':'WWD'}));
const players=[['Rafael Silva','GOL',78,92],['Caio Mendes','ZAG',76,88],['Léo Martins','ZAG',77,86],['Thiago Lima','LAT',74,84],['Bruno Alves','VOL',79,91],['Pedro Costa','MC',81,89],['Mateus Rocha','MEI',80,87],['Daniel Reis','PON',75,82],['Enzo Souza','ATA',82,93],['Nicolas Melo','ATA',80,90],['Gabriel Paz','PON',76,85],['Vitor Hugo','ZAG',73,80]];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));document.getElementById('title')={home:'Central',league:'Classificação',squad:'Elenco',game:'Partida'}[id];}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.screen));
function opponent(){return teams[round%7+1]}
function render(){let op=opponent();document.getElementById('opponentName').textContent=op.name;document.getElementById('opponentFor').textContent='FOR '+op.for;document.querySelectorAll('.roundNum').forEach(e=>e.textContent=round);document.getElementById('navRound').textContent=round;document.getElementById('gameOpponent').textContent=op.short;renderTable();renderFixtures();}
function renderTable(){let rows=[...table].sort((a,b)=>b.p-a.p||b.gd-a.gd||b.v-a.v);let pos=rows.findIndex(r=>r.t.us)+1;document.getElementById('positionStat').textContent=pos+'º';let us=rows.find(r=>r.t.us);document.getElementById('pointsStat').textContent=us.p;document.getElementById('gdStat').textContent=(us.gd>0?'+':'')+us.gd;document.getElementById('leagueTable').innerHTML=rows.map((r,i)=>`<tr class="${r.t.us?'selected':''}"><td>${i+1}</td><td><b>${r.t.name}</b></td><td><b>${r.p}</b></td><td>${r.j}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gd>0?'+':''}${r.gd}</td><td><div class="form"><i class="dot w">V</i><i class="dot d">E</i><i class="dot w">V</i></div></td></tr>`).join('');document.getElementById('miniTable').innerHTML=`<table class="table"><tbody>${rows.slice(0,5).map((r,i)=>`<tr class="${r.t.us?'selected':''}"><td>${i+1}</td><td><b>${r.t.short}</b></td><td>${r.p}</td></tr>`).join('')}</tbody></table>`}
function renderFixtures(){let op=opponent();document.getElementById('fixtures').innerHTML=`<div class="fixture"><span>Verde FC</span><b>VS</b><span>${op.short}</span></div><div class="fixture"><span>${opponentAt(round+1).short}</span><b>—</b><span>Verde FC</span></div><div class="fixture"><span>Verde FC</span><b>—</b><span>${opponentAt(round+2).short}</span></div>`}
function opponentAt(r){return teams[r%7+1]}
function toast(msg){let e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function openMatch(){show('game');if(!matchActive)initPitch()}
function initPitch(){minute=0;score=[0,0];matchActive=true;matchRunning=false;document.getElementById('minute').textContent="00'";document.getElementById('score').textContent='0 — 0';document.getElementById('commentary').textContent='A bola vai rolar.';document.getElementById('playButton').disabled=false;let html='';[[10,50],[28,25],[28,75],[45,42],[45,65],[63,50],[80,25],[80,75]].forEach((p,i)=>html+=`<div class="player-dot us" style="left:${p[0]}%;top:${p[1]}%">${i+1}</div>`);[[90,50],[72,25],[72,75],[55,42],[55,65],[37,50],[20,25],[20,75]].forEach((p,i)=>html+=`<div class="player-dot them" style="left:${p[0]}%;top:${p[1]}%">${i+1}</div>`);document.getElementById('actors').innerHTML=html;moveBall(50,50)}
function moveBall(x,y){ballPos=[x,y];let b=document.getElementById('ball');b.style.left=x+'%';b.style.top=y+'%'}
function tactic(side){if(!matchActive)return;moveBall(side==='esquerda'?38:62,side==='esquerda'?28:72);toast(side==='esquerda'?'Jogo pelo lado esquerdo':'Jogo pelo lado direito')}
function attack(){if(!matchActive)return;let usDots=[...document.querySelectorAll('.player-dot.us')];let op=opponent();let attackChance=55+(78-op.for)/2;let goal=Math.random()*100<attackChance;minute=Math.min(90,minute+5);document.getElementById('minute').textContent=minute+"'";usDots.forEach(d=>{let l=parseFloat(d.style.left);d.style.left=Math.min(88,l+6)+'%'});moveBall(82,45+Math.random()*20-10);if(goal){score[0]++;document.getElementById('score').textContent=score[0]+' — '+score[1];document.getElementById('commentary').textContent='GOL! Finalização precisa do Verde FC!';toast('⚽ GOL DO VERDE FC')}else document.getElementById('commentary').textContent='Boa jogada, mas a defesa bloqueia.'}
function advanceMatch(){if(!matchActive)initPitch();minute=Math.min(90,minute+15);document.getElementById('minute').textContent=minute+"'";let op=opponent();let win=Math.random()*100+78>50+op.for/2;if(Math.random()*100<22){let which=Math.random()<.58?0:1;if(which===0)score[0]++;else score[1]++;document.getElementById('score').textContent=score[0]+' — '+score[1];document.getElementById('commentary').textContent=which===0?'GOL do Verde FC!':'Gol do adversário.';moveBall(which===0?88:12,50)}else{document.getElementById('commentary').textContent=['O jogo está equilibrado.','A torcida empurra o time.','Grande defesa do goleiro.','Bola na área, sem conclusão.'][Math.floor(Math.random()*4)];moveBall(35+Math.random()*50,20+Math.random()*60)}if(minute>=90){finishMatch()}}
function finishMatch(){matchActive=false;document.getElementById('playButton').disabled=true;let us=table.find(r=>r.t.us),op=table.find(r=>r.t===opponent());us.j++;op.j++;let gd=score[0]-score[1];us.gd+=gd;op.gd-=gd;if(gd>0){us.p+=3;us.v++;op.d++;document.getElementById('commentary').text='Vitória do Verde FC!'}else if(gd<0){op.p+=3;op.v++;us.d++;document.getElementById('commentary').textContent='Derrota apertada.'}else{us.p++;op.p++;us.e++;op.e++;document.getElementById('commentary').textContent='Empate no tempo normal.'}toast('Fim de jogo — '+score[0]+' × '+score[1]);round++;render();document.getElementById('playButton').textContent='PRÓXIMA PARTIDA';document.getElementById('playButton').disabled=false;document.getElementById('playButton').onclick=()=>{matchActive=false;initPitch();document.getElementById('playButton').textContent='JOGAR 15 MIN';document.getElementById('playButton').onclick=advanceMatch}}
function renderRoster(){document.getElementById('roster').innerHTML=players.map((p,i)=>`<div class="player"><div class="player-head"><span style="color:${i<6?'var(--lime)':'var(--muted)'}">${i+1<10?'0'+(i+1):i+1}</span><span class="rating">${p[2]}</span></div><h3>${p[0]}</h3><p>${p[1]} · CAN</p><div class="player-line"><i style="width:${p[3]}%"></i></div></div>`).join('')}
document.querySelectorAll('.nav button')[0].click();renderRoster();render();
</script></body></html>
