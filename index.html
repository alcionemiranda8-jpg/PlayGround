<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06110c">
<link rel="icon" href="data:,">
<title>Liga Brasil — Quatro Séries</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">LIGA <span>BRASIL</span><small>QUATRO SÉRIES · UMA JORNADA</small></div>
    <div class="season-pill"><b id="seasonLabel">Temporada 2026</b><span class="div-badge" id="divBadge">Série D</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="club-card" id="clubCard"></div>
    <div class="side-foot"><button class="link-btn" onclick="newCareer()">Nova carreira</button></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 id="pageTitle">Central</h1><p id="pageSub">Sua temporada em um só lugar</p></div>
      <div class="top-actions">
        <span class="save-pill" id="savePill">Salvo</span>
        <button class="btn btn-primary" onclick="goMatch()">Jogar</button>
      </div>
    </header>
    <section class="screen active" id="screen-home"></section>
    <section class="screen" id="screen-league"></section>
    <section class="screen" id="screen-squad"></section>
    <section class="screen" id="screen-match"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="match.js"></script>
<script src="ui.js"></script>
</body>
</html>
